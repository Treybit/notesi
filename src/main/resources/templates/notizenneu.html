<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Neue Notiz</title>

    <!-- Bootstrap CSS -->
    <link href="../../static/css/bootstrap.min.css"
          rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">

    <script src="../../static/js/bootstrap.bundle.min.js"
            th:src="@{/js/bootstrap.bundle.min.js}">
    </script>
</head>

<body>
<div class="container mt-4">

    <h1 class="mb-4">Neue Notiz</h1>

    <form method="post">

        <!-- Titel -->
        <div class="mb-3">
            <label for="titel" class="form-label">Titel</label>
            <input type="text"
                   class="form-control"
                   id="titel"
                   name="titel"
                   required>
        </div>

        <!-- Notiz -->
        <div class="mb-3">
            <label for="beschreibung" class="form-label">Beschreibung</label>
            <textarea class="form-control"
                      id="beschreibung"
                      name="beschreibung"
                      rows="5"
                      required></textarea>
        </div>

        <!-- URL -->
        <div class="mb-3">
            <label for="url" class="form-label">URL <span class="text-muted">(Optional)</span></label>
            <input type="url"
                   class="form-control"
                   id="url"
                   name="url"
                   placeholder="https://tomasprodan.com">
        </div>

        <!-- Datum -->
        <div class="mb-3">
            <label for="datum" class="form-label">Datum <span class="text-muted">(Optional)</span></label>
            <input type="date"
                   class="form-control"
                   id="datum"
                   name="datum">
        </div>

        <!-- Uhrzeit -->
        <div class="mb-3">
            <label for="uhrzeit" class="form-label">Uhrzeit <span class="text-muted">(Optional)</span></label>
            <input type="time"
                   class="form-control"
                   id="uhrzeit"
                   name="uhrzeit">
        </div>

        <!-- Dringlichkeit -->
        <div class="mb-3">
            <label for="dringlichkeit" class="form-label">Dringlichkeit</label>
            <select class="form-select"
                    id="dringlichkeit"
                    name="dringlichkeit">
                <option value="NIEDRIG">Niedrig</option>
                <option value="NORMAL" selected>Normal</option>
                <option value="HOCH">Hoch</option>
                <option value="DRINGEND">Dringend</option>
            </select>
        </div>

        <!-- Buttons -->
        <button type="submit" class="btn btn-primary">
            Notiz speichern
        </button>

        <a href="/" class="btn btn-secondary">
            Abbrechen
        </a>

    </form>

</div>
</body>
</html>
