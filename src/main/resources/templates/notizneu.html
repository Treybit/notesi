<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notesi - Neue Notiz</title>

    <!-- Bootstrap CSS -->
    <link href="../../static/css/bootstrap.min.css"
          rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">

    <script src="../../static/js/bootstrap.bundle.min.js"
            th:src="@{/js/bootstrap.bundle.min.js}">
    </script>
</head>

<body>

<div class="container mt-4">

    <h1 class="mb-4">Neue Notiz</h1>

    <form th:action="@{/notiz/neu}"
          th:object="${notizForm}"
          method="post">

        <!-- Titel -->
        <div class="mb-3">
            <label for="titel" class="form-label">
                Titel
            </label>

            <input type="text"
                   class="form-control"
                   id="titel"
                   th:field="*{titel}"
                   required>
        </div>

        <!-- Beschreibung -->
        <div class="mb-3">
            <label for="beschreibung" class="form-label">
                Beschreibung
            </label>

            <textarea class="form-control"
                      id="beschreibung"
                      th:field="*{beschreibung}"
                      rows="5"
                      required></textarea>
        </div>

        <!-- URL -->
        <div class="mb-3">
            <label for="url" class="form-label">
                URL
                <span class="text-muted">(Optional)</span>
            </label>

            <input type="url"
                   class="form-control"
                   id="url"
                   th:field="*{url}"
                   placeholder="https://example.com">
        </div>

        <!-- Datum -->
        <div class="mb-3">
            <label for="datum" class="form-label">
                Datum
                <span class="text-muted">(Optional)</span>
            </label>

            <input type="date"
                   class="form-control"
                   id="datum"
                   th:field="*{datum}">
        </div>

        <!-- Uhrzeit -->
        <div class="mb-3">
            <label for="uhrzeit" class="form-label">
                Uhrzeit
                <span class="text-muted">(Optional)</span>
            </label>

            <input type="time"
                   class="form-control"
                   id="uhrzeit"
                   th:field="*{uhrzeit}">
        </div>

        <!-- Dringlichkeit -->
        <div class="mb-3">
            <label for="dringlichkeit" class="form-label">
                Dringlichkeit
            </label>

            <select class="form-select"
                    id="dringlichkeit"
                    th:field="*{dringlichkeit}">

                <option value="NIEDRIG">
                    Niedrig
                </option>

                <option value="NORMAL">
                    Normal
                </option>

                <option value="HOCH">
                    Hoch
                </option>

                <option value="DRINGEND">
                    Dringend
                </option>

            </select>
        </div>

        <!-- Buttons -->
        <button type="submit"
                class="btn btn-primary">
            Notiz speichern
        </button>

        <a th:href="@{/}"
           class="btn btn-secondary">
            Abbrechen
        </a>

    </form>

</div>



<footer class="text-center text-muted py-4">
    Made with 🖤 by Treybit<br>
    <small>Aktualisiert am 08.09.2026</small>
</footer>
</body>
</html>
