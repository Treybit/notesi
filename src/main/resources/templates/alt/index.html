<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notesi - Startseite</title>

    <!-- Bootstrap CSS -->
    <link href="../../static/css/bootstrap.min.css"
          rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">

    <script src="../../static/js/bootstrap.bundle.min.js"
            th:src="@{/js/bootstrap.bundle.min.js}">
    </script>
</head>

<body>

<div class="container mt-4">

    <h1>Notesi</h1>

    <p>Deine Notizen, einfach organisiert.</p>

    <a th:href="@{/notiz/neu}"
       class="btn btn-primary">
        Neue Notiz erstellen
    </a>






    <section class="mt-4">
        <ul class="list-group">

            <li class="list-group-item list-group-item-action"
                th:each="eintrag : ${alleNotizen}">

                <a th:href="@{/notiz/{id}(id=${eintrag.id})}"
                   th:text="${eintrag.titel}">
                    Notiztitel
                </a>

                <br>

                <span th:text="${eintrag.beschreibung}">
                Beschreibung der Notiz
                </span>

            </li>

        </ul>
    </section>

</div>

</body>
</html>
